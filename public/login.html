<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Marisquito — Entrar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-tarjeta">
    <h1 class="display">El Marisquito</h1>
    <p class="lema">Sistema de punto de venta</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-principal" id="btn-entrar">Entrar</button>
    </form>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
  // Si ya hay sesión, mandar directo a su pantalla
  const yaLogueado = Api.usuario();
  if (yaLogueado) {
    window.location.href = rutaSegunRol(yaLogueado.rol);
  }

  function rutaSegunRol(rol) {
    switch (rol) {
      case 'mesero': return '/mesero.html';
      case 'cajero': return '/caja.html';
      case 'cocina': return '/cocina.html';
      case 'admin': return '/admin.html';
      default: return '/login.html';
    }
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    const btn = document.getElementById('btn-entrar');

    errorMsg.classList.remove('mostrar');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const data = await Api.post('/auth/login', { usuario, password });
      Api.guardarSesion(data.token, data.usuario);
      window.location.href = rutaSegunRol(data.usuario.rol);
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.add('mostrar');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
