<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estación de impresión — El Marisquito</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .estacion-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }
  .estado-punto {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--alga);
    display: inline-block;
    margin-right: 8px;
    animation: pulso 1.6s infinite;
  }
  @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .log-impresiones {
    margin-top: 30px;
    width: 100%;
    max-width: 460px;
    text-align: left;
  }
  .log-fila {
    background: var(--blanco);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 0.85rem;
    box-shadow: var(--sombra);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="marca">
    <span class="display">El Marisquito</span>
    <span class="sub" id="etiqueta-estacion">Estación de impresión</span>
  </div>
  <div class="usuario" id="barra-usuario"></div>
</div>

<div class="estacion-wrap">
  <h2 class="display" style="color:var(--oceano);">
    <span class="estado-punto"></span><span id="titulo-espera">Esperando comandas y tickets…</span>
  </h2>
  <p style="opacity:0.65; max-width:420px;">
    Deja esta pantalla abierta en el dispositivo conectado a esa impresora.
    En cuanto llegue una comanda o un ticket para esta estación, se imprimirá aquí automáticamente.
  </p>

  <label id="opcion-rawbt" style="display:none; align-items:center; gap:8px; background:#fff; padding:10px 16px; border-radius:10px; box-shadow:var(--sombra); margin-top:10px; cursor:pointer; font-size:0.85rem;">
    <input type="checkbox" id="chk-rawbt" style="width:auto;" onchange="guardarPreferenciaRawBT()">
    Usar <strong>RawBT</strong> para imprimir (celular/tablet Android con impresora Bluetooth)
  </label>

  <div class="log-impresiones" id="log-impresiones"></div>
</div>

<!-- Zona invisible que solo se muestra al imprimir -->
<div class="zona-imprimible" id="zona-imprimible-auto"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
  // La estación se elige por la URL: /impresora.html?estacion=cocina o /impresora.html?estacion=barra
  // Sin el parámetro, esta pantalla imprime TODO (modo de una sola impresora).
  const parametros = new URLSearchParams(location.search);
  const estacion = parametros.get('estacion') || '';

  // Quién puede entrar a cada estación: Barra es del admin, Cocina es del panel de cocina.
  // Sin estación (modo de una sola impresora) se deja abierto a los tres, como antes.
  let rolesPermitidos = ['admin', 'cajero', 'cocina'];
  if (estacion === 'barra') rolesPermitidos = ['admin'];
  else if (estacion === 'cocina') rolesPermitidos = ['cocina'];

  const usuario = exigirSesion(rolesPermitidos);
  let procesando = false;

  const esAndroid = /Android/i.test(navigator.userAgent);
  const claveRawBT = 'usarRawBT_' + (estacion || 'general'); // preferencia guardada POR ESTE DISPOSITIVO/ESTACIÓN

  if (usuario) {
    pintarBarraSuperior(usuario);
    if (estacion === 'barra') {
      document.getElementById('etiqueta-estacion').textContent = '🍹 Estación: Barra';
      document.getElementById('titulo-espera').textContent = 'Esperando comandas de barra…';
    } else if (estacion === 'cocina') {
      document.getElementById('etiqueta-estacion').textContent = '🍽 Estación: Cocina';
      document.getElementById('titulo-espera').textContent = 'Esperando comandas de cocina…';
    }

    // La opción de RawBT solo tiene sentido en Android (en Windows/Mac se usa window.print() normal)
    if (esAndroid) {
      const opcion = document.getElementById('opcion-rawbt');
      opcion.style.display = 'flex';
      const chk = document.getElementById('chk-rawbt');
      chk.checked = localStorage.getItem(claveRawBT) === '1';
    }

    revisarPendientes();
    conectarTiempoReal();
    setInterval(revisarPendientes, 5000); // respaldo por si el socket se cae
  }

  function guardarPreferenciaRawBT() {
    const chk = document.getElementById('chk-rawbt');
    localStorage.setItem(claveRawBT, chk.checked ? '1' : '0');
    mostrarToast(chk.checked ? 'Ahora se imprime directo con RawBT' : 'Ahora se usa el diálogo normal de impresión');
  }

  function usaRawBT() {
    return esAndroid && localStorage.getItem(claveRawBT) === '1';
  }

  function conectarTiempoReal() {
    try {
      const socket = io();
      socket.on('nuevaImpresion', () => revisarPendientes());
    } catch (err) {
      console.warn('Socket.io no disponible, usando solo el respaldo periódico');
    }
  }

  async function revisarPendientes() {
    if (procesando) return; // evita mandar varios window.print() encimados
    try {
      const ruta = '/impresion/pendientes' + (estacion ? `?estacion=${estacion}` : '');
      const pendientes = await Api.get(ruta);
      if (pendientes.length === 0) return;

      procesando = true;
      for (const trabajo of pendientes) {
        await imprimirTrabajo(trabajo);
      }
      procesando = false;
    } catch (err) {
      procesando = false;
      mostrarToast(err.message, true);
    }
  }

  function imprimirTrabajo(trabajo) {
    return new Promise((resolve) => {
      if (usaRawBT()) {
        // Impresión directa: sin diálogo, sin tocar nada — el ticket llega solo a la impresora Bluetooth
        const texto = htmlAtextoPlano(trabajo.html);
        imprimirConRawBT(texto);
      } else {
        // Modo normal del navegador (Windows/Mac, o Android sin RawBT activado)
        const zona = document.getElementById('zona-imprimible-auto');
        zona.innerHTML = trabajo.html;
        window.print();
      }

      // Después de mandar a imprimir, marcamos como impreso y seguimos con el siguiente.
      // (RawBT no avisa cuando terminó, así que igual que con window.print() usamos un margen de tiempo)
      setTimeout(async () => {
        try {
          await Api.patch(`/impresion/${trabajo._id}/impreso`, {});
          agregarAlLog(trabajo);
        } catch (err) {
          console.error(err);
        }
        resolve();
      }, 800);
    });
  }

  // Convierte el ticket (que se guardó como HTML para window.print()) a texto plano
  // para mandarlo por RawBT, que solo entiende texto simple.
  function htmlAtextoPlano(html) {
    // las líneas separadoras son divs vacíos que solo llevan borde por CSS;
    // hay que volverlas una línea de guiones de verdad antes de quitar las etiquetas
    const conLineas = html.replace(/<div class="linea-punteada"[^>]*>\s*<\/div>/g, '--------------------------------');

    const contenedor = document.createElement('div');
    contenedor.innerHTML = conLineas;

    // Tomamos solo los hijos "de primer nivel" (h2, divs, etc. que están directo
    // dentro del ticket) — cada uno es un renglón del ticket.
    const lineas = [];
    contenedor.childNodes.forEach(nodo => {
      const texto = (nodo.textContent || '').replace(/\s+/g, ' ').trim();
      if (texto) lineas.push(texto);
    });

    return lineas.join('\n') + '\n\n\n'; // espacio extra al final para que el corte no tape el último renglón
  }

  function imprimirConRawBT(texto) {
    const sufijo = '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
    const textoCodificado = encodeURI(texto);

    // Se dispara desde un iframe invisible (no con window.location.href) para que
    // la pestaña de la estación de impresión NO navegue hacia RawBT — así sigue
    // viva de fondo y no hay que volver a entrar cuando regresas de imprimir.
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'intent:' + textoCodificado + sufijo;
    document.body.appendChild(iframe);
    setTimeout(() => iframe.remove(), 1500);
  }

  function agregarAlLog(trabajo) {
    const cont = document.getElementById('log-impresiones');
    const fila = document.createElement('div');
    fila.className = 'log-fila';
    const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    fila.innerHTML = `<span>${trabajo.tipo === 'comanda' ? '🍽 Comanda' : '🧾 Ticket'} impreso</span><span>${hora}</span>`;
    cont.prepend(fila);
  }
</script>
</body>
</html>
