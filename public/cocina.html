<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina — El Marisquito</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="topbar">
  <div class="marca">
    <span class="display">El Marisquito</span>
    <span class="sub">Cocina</span>
  </div>
  <div class="usuario" id="barra-usuario"></div>
</div>

<div class="contenedor">
  <div class="encabezado-seccion">
    <div>
      <div class="eyebrow">En vivo</div>
      <h2 class="display">Comandas</h2>
    </div>
  </div>

  <div class="grid-comandas" id="grid-comandas">
    <div class="cargando">Cargando comandas…</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/impresion-auto.js"></script>
<script>
  const usuario = exigirSesion(['cocina', 'admin']);

  if (usuario) {
    pintarBarraSuperior(usuario);
    cargarComandas();
    conectarTiempoReal();
    iniciarImpresionAutomatica('cocina'); // esta pantalla solo imprime SUS comandas (platillos), no las de barra
  }

  function conectarTiempoReal() {
    try {
      const socket = io();
      socket.on('nuevoItemPedido', () => cargarComandas());
      socket.on('itemActualizado', () => cargarComandas());
    } catch (err) {
      // Si falla la conexión en vivo, igual seguimos refrescando por polling
      console.warn('Socket.io no disponible, usando solo actualización periódica');
    }
  }

  async function cargarComandas() {
    const cont = document.getElementById('grid-comandas');
    try {
      const comandas = await Api.get('/cocina/comandas');
      if (comandas.length === 0) {
        cont.innerHTML = '<div class="comanda-vacia">No hay platillos pendientes ahora mismo 🦐</div>';
        return;
      }
      cont.innerHTML = comandas.map(c => `
        <div class="comanda-card">
          <div class="comanda-header">
            <span class="mesa-num">${c.paraLlevar ? `🥡 Para llevar${c.clienteLlevar ? ' — ' + c.clienteLlevar : ''}` : `Mesa ${c.mesa}`}</span>
          </div>
          ${c.notaGeneral ? `<div style="padding:8px 16px; background:#fdf6e8; font-size:0.78rem; font-style:italic;">📌 ${c.notaGeneral}</div>` : ''}
          ${c.items.map(item => `
            <div class="comanda-item ${claseAvisoTiempo(item.createdAt)}">
              <div class="nombre-item" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <span><span class="cant">${item.cantidad}×</span>${item.producto ? item.producto.nombre : 'Producto'}${item.varianteNombre ? ' (' + item.varianteNombre + ')' : ''}
                ${tiempoEsperaHtml(item.createdAt)}</span>
                <button class="btn-imprimir" style="padding:3px 8px; font-size:0.68rem; flex-shrink:0;" title="Reimprimir SOLO este platillo (no toda la mesa)" onclick='reimprimirItem(${JSON.stringify({ mesa: c.mesa, paraLlevar: c.paraLlevar, clienteLlevar: c.clienteLlevar, item }).replace(/'/g, "&apos;")})'>🖨</button>
              </div>
              ${item.notas ? `<div class="nota-item">${item.notas}</div>` : ''}
              ${item.estado === 'pendiente'
                ? `<button class="btn-avanzar a-preparando" onclick="avanzarEstado('${c.pedidoId}', '${item._id}', 'preparando')">Empezar a preparar</button>`
                : `<button class="btn-avanzar a-listo" onclick="avanzarEstado('${c.pedidoId}', '${item._id}', 'listo')">Marcar listo</button>`}
            </div>
          `).join('')}
        </div>
      `).join('');
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  function tiempoEsperaHtml(creadoEn) {
    if (!creadoEn) return '';
    const minutos = Math.floor((Date.now() - new Date(creadoEn).getTime()) / 60000);
    const tardado = minutos >= 10;
    return `<span class="tiempo-espera ${tardado ? 'tardado' : ''}">${minutos} min</span>`;
  }

  // Naranja parpadeante a partir de 15 min sin empezar/terminar, rojo parpadeante a partir de 30.
  function claseAvisoTiempo(creadoEn) {
    if (!creadoEn) return '';
    const minutos = Math.floor((Date.now() - new Date(creadoEn).getTime()) / 60000);
    if (minutos >= 30) return 'aviso-30';
    if (minutos >= 15) return 'aviso-15';
    return '';
  }

  // Reimprime SOLO un platillo (no toda la comanda de la mesa). "datos" trae
  // { mesa, paraLlevar, clienteLlevar, item } armado desde el botón 🖨 de cada renglón.
  async function reimprimirItem(datos) {
    const { mesa, paraLlevar, clienteLlevar, item } = datos;
    const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    const html = `
      <h2>EL MARISQUITO</h2>
      <div class="centrado chico">Reimpresión — ${hora}</div>
      <div class="linea-punteada"></div>
      <div class="fila-print"><strong>${paraLlevar ? `PARA LLEVAR${clienteLlevar ? ' — ' + clienteLlevar : ''}` : `MESA ${mesa}`}</strong></div>
      <div class="linea-punteada"></div>
      <div class="fila-print"><span>${item.cantidad}× ${item.producto ? item.producto.nombre : 'Producto'}${item.varianteNombre ? ' (' + item.varianteNombre + ')' : ''}</span></div>
      ${item.notas ? `<div class="chico">— ${item.notas}</div>` : ''}
      <div class="linea-punteada"></div>
    `;

    try {
      await Api.post('/impresion', { tipo: 'comanda', html, estacion: 'cocina' });
      mostrarToast('Platillo reenviado a la impresora');
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  async function avanzarEstado(pedidoId, itemId, nuevoEstado) {
    try {
      await Api.patch(`/cocina/pedidos/${pedidoId}/items/${itemId}/estado`, { estado: nuevoEstado });
      cargarComandas();
      // Solo aprovechamos el toque de "Empezar a preparar" para imprimir lo pendiente.
      // "Marcar listo" no dispara impresión.
      if (nuevoEstado === 'preparando' && window.aprovecharClicParaImprimir) {
        window.aprovecharClicParaImprimir();
      }
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  // Respaldo por si el socket no conecta, y para refrescar el cronómetro
  setInterval(cargarComandas, 6000);
</script>
</body>
</html>
