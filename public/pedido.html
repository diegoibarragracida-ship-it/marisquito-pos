<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido — El Marisquito</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="marca">
    <span class="display">El Marisquito</span>
    <span class="sub" id="sub-mesa">Mesero</span>
  </div>
  <div class="usuario" id="barra-usuario"></div>
</div>

<div class="contenedor">
  <div class="encabezado-seccion">
    <div>
      <div class="eyebrow" id="eyebrow-pedido">Mesa</div>
      <h2 class="display" id="titulo-mesa">Cargando…</h2>
    </div>
    <button class="btn-volver" style="padding:9px 18px; font-weight:600;" onclick="volverAlSalon()">← Volver al salón</button>
  </div>

  <div class="vista-pedido">
    <!-- Menú -->
    <div>
      <div class="categoria-tabs" id="categoria-tabs"></div>
      <div class="grid-menu" id="grid-menu">
        <div class="cargando">Cargando menú…</div>
      </div>
    </div>

    <!-- Ticket de comanda -->
    <div class="ticket">
      <div class="ticket-header">
        <div class="display">Comanda</div>
        <div class="mesa-num" id="ticket-mesa-num">Mesa —</div>
      </div>
      <div class="campo-inline" id="bloque-cliente-llevar" style="display:none; margin-bottom:8px;">
        <label>Nombre del cliente</label>
        <input type="text" id="cliente-llevar-texto" placeholder="Ej. Juan, o 'ventanilla'" onblur="guardarClienteLlevar()">
      </div>
      <div class="nota-general-caja">
        <strong>Nota del pedido</strong>
        <textarea id="nota-general-texto" placeholder="Ej. cliente alérgico a mariscos, es cumpleaños..." onblur="guardarNotaGeneral()"></textarea>
      </div>
      <div id="carrito-pendiente"></div>
      <div id="ticket-items">
        <div class="ticket-vacio">Aún no hay productos agregados</div>
      </div>
      <div class="ticket-footer">
        <span>Total</span>
        <span id="ticket-total">$0.00</span>
      </div>
      <div class="ticket-acciones">
        <button class="btn-volver" onclick="cargarPedido()">Actualizar</button>
        <button class="btn-cuenta" id="btn-pedir-cuenta" onclick="pedirCuenta()">Pedir cuenta</button>
      </div>
    </div>
  </div>
</div>

<!-- Botón flotante para enviar la orden con lo que se va agregando -->
<button id="btn-enviar-orden" onclick="enviarOrden()" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:30; background:var(--camaron); color:#fff; border:none; border-radius:30px; padding:16px 28px; font-weight:700; font-size:1rem; box-shadow:0 6px 18px rgba(0,0,0,0.25); cursor:pointer;">
  📤 Enviar orden (<span id="conteo-carrito">0</span>)
</button>

<!-- Modal para notas del producto -->
<div class="modal-fondo" id="modal-notas">
  <div class="modal-caja">
    <h3>Agregar a la comanda</h3>
    <p style="font-size:0.85rem; opacity:0.7;" id="modal-producto-nombre"></p>
    <div id="bloque-variantes" style="display:none; margin-bottom:14px;">
      <label style="display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; color:var(--oceano); margin-bottom:8px;">Elige el tamaño</label>
      <div id="variantes-opciones" class="variantes-opciones"></div>
    </div>
    <div id="bloque-modificadores" style="margin-bottom:10px;">
      <label style="display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; color:var(--oceano); margin-bottom:8px;">Toca lo que se ofrezca (opcional)</label>
      <div id="modificadores-opciones" class="variantes-opciones"></div>
    </div>
    <textarea id="modal-nota-texto" placeholder="¿Algo más? Escríbelo aquí (opcional)"></textarea>
    <div class="modal-botones">
      <button class="btn-volver" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-principal" onclick="confirmarAgregar()">Agregar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/alertas.js"></script>
<script>
  const usuario = exigirSesion(['mesero', 'admin']);
  const params = new URLSearchParams(window.location.search);
  const mesaId = params.get('mesa');
  const llevarId = params.get('llevar');
  const esLlevar = !!llevarId;

  let productos = [];
  let categorias = [];
  let categoriaActiva = 'todas';
  let pedidoActual = null;
  let productoParaAgregar = null;
  let carrito = []; // productos que el mesero ya juntó pero AÚN no se han mandado a cocina/barra

  if (usuario && (mesaId || llevarId)) {
    pintarBarraSuperior(usuario);
    if (esLlevar) {
      document.getElementById('eyebrow-pedido').textContent = 'Para llevar';
      document.getElementById('bloque-cliente-llevar').style.display = 'block';
      document.getElementById('btn-pedir-cuenta').style.display = 'none';
    }
    init();
    conectarTiempoReal();
  } else if (!mesaId && !llevarId) {
    window.location.href = '/mesero.html';
  }

  function volverAlSalon() {
    if (carrito.length > 0 && !confirm('Todavía tienes productos sin enviar a cocina/barra. ¿Salir de todos modos y perderlos?')) {
      return;
    }
    window.location.href = '/mesero.html';
  }

  function conectarTiempoReal() {
    try {
      const socket = io();
      socket.on('itemActualizado', (data) => {
        const esDeEstePedido = esLlevar ? (pedidoActual && data.pedidoId === pedidoActual._id) : data.mesaId === mesaId;
        if (esDeEstePedido && data.estado === 'listo') {
          alertarPlatilloListo(`¡${data.nombreProducto} está listo! 🍽`);
          cargarPedido();
        }
      });
    } catch (err) {
      console.warn('Socket.io no disponible, usando solo actualización periódica');
    }
  }

  async function init() {
    await Promise.all([cargarMenu(), cargarPedido()]);
  }

  async function cargarMenu() {
    try {
      const [prods, cats] = await Promise.all([
        Api.get('/admin/productos'),
        Api.get('/categorias')
      ]);
      productos = prods;
      categorias = cats;
      pintarTabsCategorias();
      pintarMenu();
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  function pintarTabsCategorias() {
    const cont = document.getElementById('categoria-tabs');
    const tabs = [{ _id: 'todas', nombre: 'Todas' }, ...categorias];
    cont.innerHTML = tabs.map(c => `
      <button class="categoria-tab ${categoriaActiva === c._id ? 'activa' : ''}" onclick="seleccionarCategoria('${c._id}')">
        ${c.nombre}
      </button>
    `).join('');
  }

  function seleccionarCategoria(id) {
    categoriaActiva = id;
    pintarTabsCategorias();
    pintarMenu();
  }

  // Colores de contorno por tipo de platillo, para que los meseros ubiquen
  // rápido qué es qué. Primero se revisa el NOMBRE del producto (para que
  // "Filete Sol" salga del color de filetes aunque esté en Especialidades,
  // o "Chilpachole de jaiba" salga del color de caldos), y si no coincide
  // ningún patrón, se usa el color de su CATEGORÍA.
  const COLOR_POR_PATRON = [
    { patron: /tostada/i, color: '#8a5a35' },                         // café
    { patron: /caldo|cazuela|chilpachole|sopa/i, color: '#c0392b' },  // rojo
    { patron: /filete/i, color: '#2471a3' }                           // azul
  ];
  const COLOR_POR_CATEGORIA = {
    'Cocteles': '#2e8b57',       // verde
    'Entradas': '#d68910',       // naranja
    'Especialidades': '#7d3c98', // morado
    'Carnes': '#922b21',         // vino/marrón rojizo
    'Extras': '#7f8c8d',         // gris
    'Postres': '#c2185b',        // rosa
    'Bebidas': '#16a085',        // verde azulado
    'Refrescos': '#2980b9',      // azul
    'Cervezas': '#b8860b'        // dorado/ámbar
  };
  function colorDelProducto(p) {
    for (const regla of COLOR_POR_PATRON) {
      if (regla.patron.test(p.nombre)) return regla.color;
    }
    const nombreCategoria = p.categoria && p.categoria.nombre;
    return COLOR_POR_CATEGORIA[nombreCategoria] || '#95a5a6';
  }

  // Modificadores rápidos para agilizar la toma de pedido (en vez de escribir
  // a mano). Cada tipo de platillo tiene los suyos — no todos llevan cebolla,
  // limón o cilantro. Se revisa primero el NOMBRE (para casos específicos como
  // "al gusto", tostadas, tortas, carnes...) y si nada coincide, se usa un
  // default razonable según la CATEGORÍA.
  const MODS_POR_PATRON = [
    // "Al gusto" = el cliente elige la preparación
    { patron: /al gusto/i, mods: ['Al mojo de ajo', 'A la diabla', 'Al ajillo', 'Empanizado', 'A la plancha', 'A la veracruzana', 'Para llevar'] },
    { patron: /coctel|cóctel|vuelve a la vida/i, mods: ['Sin cebolla', 'Sin cilantro', 'Sin limón', 'Extra salsa', 'Extra picante', 'Para llevar'] },
    { patron: /guacamole/i, mods: ['Sin cebolla', 'Sin cilantro', 'Sin limón', 'Extra chile', 'Para llevar'] },
    { patron: /tostada/i, mods: ['Sin cebolla', 'Sin lechuga', 'Extra limón', 'Extra picante', 'Para llevar'] },
    { patron: /torta/i, mods: ['Sin mayonesa', 'Sin aguacate', 'Extra queso', 'Para llevar'] },
    { patron: /ensalada/i, mods: ['Aderezo aparte', 'Sin cebolla', 'Sin jitomate', 'Para llevar'] },
    { patron: /caldo|cazuela|chilpachole|sopa/i, mods: ['Sin picante', 'Extra picante', 'Sin cebolla', 'Para llevar'] },
    { patron: /filete|milanesa|pechuga|arrachera|tampiqueña/i, mods: ['Bien cocido', 'Término medio', 'Tres cuartos', 'Sin ajo', 'Extra salsa', 'Para llevar'] },
    { patron: /papas/i, mods: ['Con catsup', 'Con mayonesa', 'Sin sal', 'Para llevar'] },
    { patron: /frijol/i, mods: ['Extra queso', 'Para llevar'] },
    { patron: /licuado|horchata|jamaica|chocomilk/i, mods: ['Sin hielo', 'Extra hielo', 'Poca azúcar', 'Para llevar'] },
    { patron: /café|nescafé|chocolate|^té$/i, mods: ['Poca azúcar', 'Extra caliente', 'Con leche extra', 'Para llevar'] }
  ];
  const MODS_POR_CATEGORIA = {
    'Refrescos': ['Bien fría', 'Con limón', 'Para llevar'],
    'Cervezas': ['Bien fría', 'Con limón', 'Chelada', 'Para llevar'],
    'Postres': ['Sin crema', 'Extra crema', 'Para llevar'],
    'Extras': ['Extra picante', 'Para llevar'],
    'Entradas': ['Extra picante', 'Para llevar']
  };
  function modificadoresPara(p) {
    // Si el admin definió modificadores personalizados para este producto, esos mandan.
    if (p.modificadores && p.modificadores.length > 0) return p.modificadores;

    for (const regla of MODS_POR_PATRON) {
      if (regla.patron.test(p.nombre)) return regla.mods;
    }
    const nombreCategoria = p.categoria && p.categoria.nombre;
    return MODS_POR_CATEGORIA[nombreCategoria] || ['Para llevar'];
  }

  function pintarMenu() {
    const cont = document.getElementById('grid-menu');
    const lista = productos.filter(p => {
      if (categoriaActiva === 'todas') return true;
      return p.categoria && p.categoria._id === categoriaActiva;
    });

    if (lista.length === 0) {
      cont.innerHTML = '<div class="ticket-vacio">No hay productos en esta categoría</div>';
      return;
    }

    cont.innerHTML = lista.map(p => {
      const tieneVariantes = p.variantes && p.variantes.length > 0;
      const precioMostrado = tieneVariantes
        ? `Desde $${Math.min(...p.variantes.map(v => v.precio)).toFixed(2)}`
        : `$${p.precio.toFixed(2)}`;
      const color = colorDelProducto(p);
      return `
      <div class="producto-card ${p.disponible ? '' : 'agotado'}" style="border: 3px solid ${color}; box-shadow: 0 0 0 1px ${color}55, var(--sombra); padding-top:0; overflow:hidden;">
        <div style="background:${color}; height:8px; margin:-14px -14px 6px -14px;"></div>
        ${p.foto ? `<img class="foto-producto" src="${p.foto}" alt="">` : ''}
        <span class="nombre">${p.esPaquete ? '📦 ' : ''}${p.nombre}</span>
        <span class="precio">${precioMostrado}</span>
        <button ${p.disponible ? '' : 'disabled'} onclick='abrirModalNotas(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
          ${p.disponible ? 'Agregar' : 'Agotado'}
        </button>
      </div>
    `;
    }).join('');
  }

  let varianteElegida = '';
  let modsElegidos = [];

  function abrirModalNotas(producto) {
    productoParaAgregar = producto._id;
    varianteElegida = '';
    modsElegidos = [];
    document.getElementById('modal-producto-nombre').textContent = producto.nombre;
    document.getElementById('modal-nota-texto').value = '';

    const contMods = document.getElementById('modificadores-opciones');
    contMods.innerHTML = modificadoresPara(producto).map(m => `
      <button type="button" class="btn-variante" data-mod="${m.replace(/'/g, "&apos;")}" onclick="toggleModificador(this, '${m.replace(/'/g, "\\'")}')">${m}</button>
    `).join('');

    const bloque = document.getElementById('bloque-variantes');
    const opciones = document.getElementById('variantes-opciones');
    if (producto.variantes && producto.variantes.length > 0) {
      bloque.style.display = 'block';
      varianteElegida = producto.variantes[0].nombre;
      opciones.innerHTML = producto.variantes.map((v, i) => `
        <button type="button" class="btn-variante ${i === 0 ? 'activa' : ''}" data-nombre="${v.nombre}" onclick="elegirVariante(this, '${v.nombre.replace(/'/g, "\\'")}')">
          ${v.nombre}<span class="variante-precio">$${v.precio.toFixed(2)}</span>
        </button>
      `).join('');
    } else {
      bloque.style.display = 'none';
      opciones.innerHTML = '';
    }

    document.getElementById('modal-notas').classList.add('mostrar');
  }

  function toggleModificador(btn, nombre) {
    btn.classList.toggle('activa');
    if (modsElegidos.includes(nombre)) {
      modsElegidos = modsElegidos.filter(m => m !== nombre);
    } else {
      modsElegidos.push(nombre);
    }
  }

  function elegirVariante(btn, nombre) {
    varianteElegida = nombre;
    document.querySelectorAll('#variantes-opciones .btn-variante').forEach(b => b.classList.remove('activa'));
    btn.classList.add('activa');
  }

  function cerrarModal() {
    document.getElementById('modal-notas').classList.remove('mostrar');
    productoParaAgregar = null;
  }

  function confirmarAgregar() {
    if (!productoParaAgregar) return;
    const notaLibre = document.getElementById('modal-nota-texto').value.trim();
    const notas = [modsElegidos.join(', '), notaLibre].filter(Boolean).join(' — ');
    const producto = productos.find(p => p._id === productoParaAgregar);
    if (!producto) return;

    let precioUnitario = producto.precio;
    if (producto.variantes && producto.variantes.length > 0) {
      const variante = producto.variantes.find(v => v.nombre === varianteElegida);
      precioUnitario = variante ? variante.precio : producto.variantes[0].precio;
    }

    carrito.push({
      productoId: productoParaAgregar,
      nombre: producto.nombre,
      varianteNombre: varianteElegida || '',
      cantidad: 1,
      notas,
      precioUnitario
    });

    mostrarToast(`${producto.nombre} agregado — te falta enviar la orden`);
    cerrarModal();
    pintarCarrito();
  }

  function pintarCarrito() {
    const cont = document.getElementById('carrito-pendiente');
    const btnEnviar = document.getElementById('btn-enviar-orden');

    if (carrito.length === 0) {
      cont.innerHTML = '';
      btnEnviar.style.display = 'none';
      return;
    }

    document.getElementById('conteo-carrito').textContent = carrito.length;
    btnEnviar.style.display = 'block';

    cont.innerHTML = `
      <div style="background:#fff8ee; border:1.5px dashed var(--camaron); border-radius:12px; padding:10px 12px; margin-bottom:12px;">
        <div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; color:var(--camaron-oscuro); margin-bottom:6px;">
          🕓 Por enviar (todavía no está en cocina/barra)
        </div>
        ${carrito.map((item, i) => `
          <div class="ticket-item" style="padding:6px 0;">
            <div class="info">
              <span class="cantidad">${item.cantidad}×</span>${item.nombre}${item.varianteNombre ? ' (' + item.varianteNombre + ')' : ''}
              ${item.notas ? `<div style="font-size:0.75rem; opacity:0.65;">${item.notas}</div>` : ''}
            </div>
            <div style="text-align:right;">
              <div class="precio-linea">$${(item.precioUnitario * item.cantidad).toFixed(2)}</div>
              <button class="btn-cancelar" onclick="quitarDelCarrito(${i})">Quitar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function quitarDelCarrito(indice) {
    carrito.splice(indice, 1);
    pintarCarrito();
  }

  async function enviarOrden() {
    if (carrito.length === 0 || !pedidoActual) return;
    try {
      await Api.post(`/pedidos/${pedidoActual._id}/items/lote`, {
        items: carrito.map(item => ({
          productoId: item.productoId,
          varianteNombre: item.varianteNombre,
          cantidad: item.cantidad,
          notas: item.notas
        }))
      });
      mostrarToast('Orden enviada — imprimiendo en cocina/barra 🖨');
      carrito = [];
      pintarCarrito();
      await Promise.all([cargarMenu(), cargarPedido()]);
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  async function cargarPedido() {
    try {
      const anterior = pedidoActual;
      pedidoActual = esLlevar
        ? await Api.get(`/pedidos/${llevarId}`)
        : await Api.get(`/pedidos/mesa/${mesaId}/actual`);
      detectarPlatillosListos(anterior, pedidoActual);

      const titulo = esLlevar ? `🥡 Para llevar${pedidoActual.clienteLlevar ? ' — ' + pedidoActual.clienteLlevar : ''}` : `Mesa ${pedidoActual.mesa.numero}`;
      document.getElementById('titulo-mesa').textContent = titulo;
      document.getElementById('ticket-mesa-num').textContent = esLlevar ? '🥡 Para llevar' : `Mesa ${pedidoActual.mesa.numero}`;
      document.getElementById('sub-mesa').textContent = esLlevar ? 'Para llevar' : `Mesa ${pedidoActual.mesa.numero}`;

      const campoNota = document.getElementById('nota-general-texto');
      if (document.activeElement !== campoNota) {
        campoNota.value = pedidoActual.notaGeneral || '';
      }
      if (esLlevar) {
        const campoCliente = document.getElementById('cliente-llevar-texto');
        if (document.activeElement !== campoCliente) {
          campoCliente.value = pedidoActual.clienteLlevar || '';
        }
      }
      pintarTicket();
    } catch (err) {
      mostrarToast(esLlevar ? 'No se encontró el pedido' : 'No se encontró un pedido abierto para esta mesa', true);
    }
  }

  async function guardarClienteLlevar() {
    if (!pedidoActual) return;
    const clienteLlevar = document.getElementById('cliente-llevar-texto').value;
    try {
      await Api.patch(`/pedidos/${pedidoActual._id}/cliente-llevar`, { clienteLlevar });
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  function pintarTicket() {
    const cont = document.getElementById('ticket-items');
    const items = pedidoActual.items || [];

    if (items.length === 0) {
      cont.innerHTML = '<div class="ticket-vacio">Aún no hay productos agregados</div>';
      document.getElementById('ticket-total').textContent = '$0.00';
      return;
    }

    let total = 0;
    cont.innerHTML = items.map(item => {
      const activo = item.estado !== 'cancelado';
      if (activo) total += item.precioUnitario * item.cantidad;
      const nombreConVariante = item.varianteNombre ? `${item.producto.nombre} (${item.varianteNombre})` : item.producto.nombre;
      return `
        <div class="ticket-item">
          <div class="info">
            <span class="cantidad">${item.cantidad}×</span>${nombreConVariante}
            ${item.notas ? `<div style="font-size:0.75rem; opacity:0.65;">${item.notas}</div>` : ''}
            <div><span class="estado-chip ${item.estado}">${item.estado}</span></div>
          </div>
          <div style="text-align:right;">
            <div class="precio-linea">$${(item.precioUnitario * item.cantidad).toFixed(2)}</div>
            ${activo ? `<button class="btn-cancelar" onclick="cancelarItem('${item._id}')">Cancelar</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('ticket-total').textContent = `$${total.toFixed(2)}`;
  }

  function detectarPlatillosListos(anterior, nuevo) {
    if (!anterior || !nuevo) return;
    for (const item of nuevo.items) {
      if (item.estado !== 'listo') continue;
      const itemAntes = anterior.items.find(i => i._id === item._id);
      if (itemAntes && itemAntes.estado !== 'listo') {
        alertarPlatilloListo(`¡${item.producto.nombre} está listo! 🍽`);
      }
    }
  }

  async function cancelarItem(itemId) {
    if (!confirm('¿Cancelar este producto? Se repondrá el stock.')) return;
    try {
      await Api.patch(`/pedidos/${pedidoActual._id}/items/${itemId}/cancelar`, {});
      mostrarToast('Producto cancelado');
      await Promise.all([cargarMenu(), cargarPedido()]);
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  async function pedirCuenta() {
    try {
      await Api.patch(`/mesas/${mesaId}/pedir-cuenta`, {});
      mostrarToast('Cuenta pedida — la caja puede cobrar cuando quieras');
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  async function guardarNotaGeneral() {
    if (!pedidoActual) return;
    const notaGeneral = document.getElementById('nota-general-texto').value;
    try {
      await Api.patch(`/pedidos/${pedidoActual._id}/nota`, { notaGeneral });
    } catch (err) {
      mostrarToast(err.message, true);
    }
  }

  // Refresca la comanda cada 6s para ver cambios de estado que hace cocina
  setInterval(cargarPedido, 6000);
</script>
